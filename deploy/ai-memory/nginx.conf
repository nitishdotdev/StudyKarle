# nginx reverse-proxy for ai-memory
# Place this file at: /etc/nginx/conf.d/ai-memory.conf
# (or mount it as shown in docker-compose.yml)
#
# Prerequisites:
# - TLS certificate at /etc/letsencrypt/live/YOUR_DOMAIN/ (Certbot / Let's Encrypt)
# - Adjust `server_name` and certificate paths to match your domain

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # ── Rate limiting (protect MCP endpoint) ─────────────────────────────────
    # Define this in the http{} block of nginx.conf if not already present:
    # limit_req_zone $binary_remote_addr zone=ai_memory:10m rate=30r/m;
    # Uncomment the next two lines once that zone is defined:
    # limit_req zone=ai_memory burst=20 nodelay;
    # limit_req_status 429;

    # ── Proxy to ai-memory server ─────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:49374;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events used by MCP)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streams
        proxy_buffering    off;
        proxy_cache        off;

        # Timeouts appropriate for long-lived MCP connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Restrict access to bearer-token clients only
        # (ai-memory enforces authentication internally;
        #  this is defence-in-depth at the nginx layer)
        if ($http_authorization = "") {
            return 401;
        }
    }

    # ── Health check endpoint (unauthenticated, for uptime monitors) ──────────
    location = /health {
        proxy_pass http://127.0.0.1:49374/health;
        proxy_http_version 1.1;
        access_log off;
    }
}
